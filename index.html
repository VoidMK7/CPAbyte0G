<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HillsByte Proof</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:Arial,sans-serif;background:#07130e;color:#f2fff7;margin:0;padding:20px}button,input,textarea,select{padding:11px;border-radius:10px;border:1px solid #244f3b;background:#0d2118;color:white}button{cursor:pointer;background:#19b86b;border:0;font-weight:700}.card{background:#0c1e15;border:1px solid #1c4a34;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#8bb5a0}.row{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.proof{max-width:100%;max-height:240px;border-radius:12px;margin:5px}.danger{background:#a52c3a}.admin{border-color:#2f8060}</style></head><body><h1>HillsByte Proof</h1><div id="app">Loading…</div><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const app=document.getElementById('app');
const headers=()=>({'content-type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const [me,t]=await Promise.all([api('/api/me'),api('/api/tasks')]);let html=`<div class="card"><b>${esc(me.user.first_name||'User')}</b><div class="muted">Role: ${esc(me.role)} · Balance: $${Number(me.user.balance||0).toFixed(2)}</div></div>`;for(const x of t.tasks)html+=`<div class="card"><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p><b>Reward: $${Number(x.reward).toFixed(2)}</b><form onsubmit="submitProof(event,${x.id})"><p><input type="file" name="proofs" accept="image/*" multiple required></p><p><textarea name="note" placeholder="Optional note"></textarea></p><button>Submit proof</button></form></div>`;if(me.role==='admin'||me.role==='reviewer')html+=`<div class="card admin"><h2>Review Center</h2><button onclick="review()">Open pending proofs</button><div id="review"></div></div>`;if(me.role==='admin')html+=`<div class="card admin"><h2>Admin</h2><input id="tt" placeholder="Task title"><textarea id="td" placeholder="Task instructions"></textarea><input id="tr" type="number" step="0.01" value="0.70"><button onclick="createTask()">Create task</button><p class="muted">Default reward is $0.70. Tasks are stored in Supabase and can be posted to the Telegram channel independently of Base44.</p></div>`;app.innerHTML=html}catch(e){app.innerHTML='<div class="card">'+esc(e.message)+'<br><span class="muted">Open this page inside the Telegram Mini App so Telegram init data is available.</span></div>'}}
async function submitProof(e,id){e.preventDefault();const f=new FormData(e.target);f.append('task_id',id);try{const r=await fetch('/api/submissions',{method:'POST',headers:{'X-Telegram-Init-Data':tg?.initData||''},body:f});const j=await r.json();if(!r.ok)throw Error(j.error);alert('Proof submitted');load()}catch(x){alert(x.message)}}
async function review(){const r=await api('/api/reviewer/queue');const box=document.getElementById('review');box.innerHTML=r.submissions.length?r.submissions.map(s=>`<div class="card"><b>${esc(s.tasks.title)}</b><div class="muted">@${esc(s.users.username||'user')} · $${Number(s.tasks.reward).toFixed(2)}</div>${(s.proof_urls||[]).map(u=>`<img class="proof" src="${esc(u)}">`).join('')}<p>${esc(s.note||'')}</p><div class="row"><button onclick="approve(${s.id})">Approve</button><button class="danger" onclick="rejectIt(${s.id})">Reject</button></div></div>`).join(''):'<p class="muted">No pending proofs.</p>'}
async function approve(id){await api('/api/reviewer/'+id+'/approve',{method:'POST'});review()}async function rejectIt(id){const reason=prompt('Reason for rejection?')||'Proof did not meet requirements.';await api('/api/reviewer/'+id+'/reject',{method:'POST',body:JSON.stringify({reason})});review()}
async function createTask(){const title=document.getElementById('tt').value,description=document.getElementById('td').value,reward=document.getElementById('tr').value;const r=await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title,description,reward})});await api('/api/admin/tasks/'+r.task.id+'/post',{method:'POST'});alert('Task created and posted to the Telegram channel');load()}
load();
</script></body></html>
