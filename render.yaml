services:
  - type: web
    name: hillsbyte-proof-management-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_STORAGE_BUCKET
        value: task-proofs
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MODERATOR_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAIN_APP_API_URL
        sync: false
      - key: MAIN_APP_API_SECRET
        sync: false
      - key: ADMIN_WEB_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
